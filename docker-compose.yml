version: "3.8"

services:
  app:
    build: .
    container_name: patrimonio-app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./patrimonio.db
      - API_DEBUG=True
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
